name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>${{ secrets.ANYPOINT_USERNAME }}</username>
                <password>${{ secrets.ANYPOINT_PASSWORD }}</password>
              </server>
              <server>
                <id>releases-ee</id>
                <username>${{ secrets.MULE_EE_USERNAME }}</username>
                <password>${{ secrets.MULE_EE_PASSWORD }}</password>
              </server>          
            </servers>
            <profiles>
              <profile>
                <id>mule-extra-repos</id>
                <activation><activeByDefault>true</activeByDefault></activation>
                <repositories>
                  <repository>
                    <id>MuleRepository</id>
                    <url>https://repository.mulesoft.org/releases/</url>
                  </repository>
                  <repository>
                    <id>mulesoft-releases</id>
                    <url>https://repository.mulesoft.org/nexus/content/repositories/releases/</url>
                  </repository>
                  <repository>
                    <id>mulesoft-public</id>
                    <url>https://repository.mulesoft.org/nexus/content/repositories/public/</url>
                  </repository>
          		  <repository>
                    <id>releases-ee</id>
                    <name>MuleRepository</name>
                    <url>https://repository.mulesoft.org/nexus-ee/content/repositories/releases-ee/</url>
                    <layout>default</layout>
                    <releases>
                    <enabled>true</enabled>
                    </releases>
                    <snapshots>
                    <enabled>true</enabled>
                    </snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
          </settings>
          EOF

      - name: Build and Test
        run: mvn clean deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>${{ secrets.MULE_EE_USERNAME }}</username>
                <password>${{ secrets.MULE_EE_PASSWORD }}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>mule-extra-repos</id>
                <activation><activeByDefault>true</activeByDefault></activation>
                <repositories>
                  <repository>
                    <id>MuleRepository</id>
                    <url>https://repository.mulesoft.org/releases/</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
          </settings>
          EOF

      - name: Deploy to CloudHub 2.0
        run: |
          mvn clean deploy -DmuleDeploy \
            -Danypoint.username=${{ secrets.ANYPOINT_USERNAME }} \
            -Danypoint.password=${{ secrets.ANYPOINT_PASSWORD }} \
            -Danypoint.environment=Sandbox \
            -Danypoint.target=Cloudhub-US-East-2 \
            -Danypoint.appName=greeting-api \
            -Dmule.version=4.9.0 \
            -Danypoint.platform.client_id=${{ secrets.ENV_CLIENT_ID }} \
            -Danypoint.platform.client_secret=${{ secrets.ENV_CLIENT_SECRET }} \
            -Dapi.id=0