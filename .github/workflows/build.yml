name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>${{ secrets.ANYPOINT_USERNAME }}</username>
                <password>${{ secrets.ANYPOINT_PASSWORD }}</password>
              </server>
              <server>
                <id>releases-ee</id>
                <username>${{ secrets.MULE_EE_USERNAME }}</username>
                <password>${{ secrets.MULE_EE_PASSWORD }}</password>
              </server>          
            </servers>
            <profiles>
              <profile>
                <id>mule-extra-repos</id>
                <activation><activeByDefault>true</activeByDefault></activation>
                <repositories>
                  <repository>
                    <id>MuleRepository</id>
                    <url>https://repository.mulesoft.org/releases/</url>
                  </repository>
                  <repository>
                    <id>mulesoft-releases</id>
                    <url>https://repository.mulesoft.org/nexus/content/repositories/releases/</url>
                  </repository>
                  <repository>
                    <id>mulesoft-public</id>
                    <url>https://repository.mulesoft.org/nexus/content/repositories/public/</url>
                  </repository>
          		  <repository>
                    <id>releases-ee</id>
                    <name>MuleRepository</name>
                    <url>https://repository.mulesoft.org/nexus-ee/content/repositories/releases-ee/</url>
                    <layout>default</layout>
                    <releases>
                    <enabled>true</enabled>
                    </releases>
                    <snapshots>
                    <enabled>true</enabled>
                    </snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
          </settings>
          EOF

      - name: Build and Test
        run: mvn clean test

      - name: Publish to Exchange
        run: mvn clean deploy -DskipMunitTests

  provision-api:
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
      api_id: ${{ steps.create-api.outputs.api_id }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Bearer Token
        id: get-token
        run: |
          TOKEN=$(curl -s -X POST https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=${{ secrets.CONNECTED_APP_CLIENT_ID }}" \
            --data-urlencode "client_secret=${{ secrets.CONNECTED_APP_CLIENT_SECRET }}" \
            --data-urlencode "grant_type=client_credentials" \
            | jq -r '.access_token')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          
      - name: Create API Instance
        id: create-api
        env:
          API_URI: "https://greeting-api.cloudhub.io"
          API_LABEL: "greeting-api-instance-v1"
          API_GROUP_ID: "26be0591-c1a3-4c05-be0b-98098810764b"
          API_ASSET_ID: "test-instance"
          API_ASSET_VERSION: "1.0.0"

        run: |
          # 1. Substitute variables in the template and output to a temporary payload file
          envsubst < .github/workflows/create-api-instance-payload-template.json > temp-api-instance-payload.json

          # 2. (Optional debug step) Echo the compiled payload to verify values are set
          # echo "Generated Payload:"
          # cat temp-api-instance-payload.json
          
          # 3. Post the compiled temporary JSON file directly
          API_ID=$(curl -s -X POST \
            "https://anypoint.mulesoft.com/apimanager/api/v1/organizations/${{ secrets.ANYPOINT_ORG_ID }}/environments/${{ secrets.ANYPOINT_ENV_ID }}/apis" \
            -H "Authorization: Bearer ${{ steps.get-token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "@temp-api-instance-payload.json" | jq -r '.id')
          echo "api_id=$API_ID" >> $GITHUB_OUTPUT

      - name: Apply Rate Limiting Policy
        env:
          TIME_MILLI_SECONDS: 60000
          MAX_REQ: 3

        run: |
          # 1. Substitute variables in the template and output to a temporary payload file
          envsubst < .github/workflows/apply-policy-payload-template.json > temp-apply-policy-payload.json

          # 2. (Optional debug step) Echo the compiled payload to verify values are set
          # echo "Generated Payload:"
          # cat temp-apply-policy-payload.json
          
          # 3. Post the compiled temporary JSON file directly
          curl -s -X POST \
            "https://anypoint.mulesoft.com/apimanager/api/v1/organizations/${{ secrets.ANYPOINT_ORG_ID }}/environments/${{ secrets.ANYPOINT_ENV_ID }}/apis/${{ steps.create-api.outputs.api_id }}/policies" \
            -H "Authorization: Bearer ${{ steps.get-token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "@temp-apply-policy-payload.json"

  deploy:
    runs-on: ubuntu-latest
    needs: provision-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Deploy to CloudHub 2.0
        run: |
          mvn clean deploy -DmuleDeploy \
            -Dconnected.app.client.id=${{ secrets.CONNECTED_APP_CLIENT_ID }} \
            -Dconnected.app.client.secret=${{ secrets.CONNECTED_APP_CLIENT_SECRET }} \
            -Danypoint.environment=Sandbox \
            -Danypoint.target=Cloudhub-US-East-2 \
            -Danypoint.appName=greeting-api-v1 \
            -Dmule.version=4.9.0 \
            -Danypoint.platform.client_id=${{ secrets.ENV_CLIENT_ID }} \
            -Danypoint.platform.client_secret=${{ secrets.ENV_CLIENT_SECRET }} \
            -Dapi.id=${{ needs.provision-api.outputs.api_id }} \
            -DskipMunitTests